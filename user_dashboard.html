<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Uber - Book Your Ride</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-selector {
            margin-bottom: 20px;
        }
        
        .user-selector select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .ride-status {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .ride-status.pending {
            border-left: 4px solid #f39c12;
        }
        
        .ride-status.accepted {
            border-left: 4px solid #27ae60;
        }
        
        .ride-status.completed {
            border-left: 4px solid #2980b9;
        }
        
        .ride-status.rejected {
            border-left: 4px solid #e74c3c;
        }
        
        .status-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .status-pending .status-icon { color: #f39c12; }
        .status-accepted .status-icon { color: #27ae60; }
        .status-completed .status-icon { color: #2980b9; }
        .status-rejected .status-icon { color: #e74c3c; }
        
        .rides-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .rides-table th,
        .rides-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .rides-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .rides-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .status-cell {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            color: white;
        }
        
        .status-pending { background: #f39c12; }
        .status-accepted { background: #27ae60; }
        .status-completed { background: #2980b9; }
        .status-rejected { background: #e74c3c; }
        .status-in_progress { background: #9b59b6; }
        
        .no-rides {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .price-estimate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
        }
        
        .auto-refresh {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 15px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-taxi"></i> Mini Uber</h1>
            <p>Book your ride in seconds</p>
        </div>
        
        <div class="main-content">
            <!-- Left Panel - Book Ride -->
            <div class="card">
                <h2><i class="fas fa-plus-circle"></i> Book New Ride</h2>
                
                <div class="user-selector">
                    <label for="userSelect">Select User:</label>
                    <select id="userSelect" onchange="switchUser()">
                        <option value="user001">John Smith</option>
                        <option value="user002">Sarah Wilson</option>
                        <option value="user003">Mike Johnson</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="pickup">Pickup Location</label>
                    <input type="text" id="pickup" placeholder="Enter pickup location" required>
                </div>
                
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" placeholder="Where do you want to go?" required>
                </div>
                
                <div class="price-estimate" id="priceEstimate" style="display: none;">
                    <div style="font-size: 18px; font-weight: bold;">Estimated Fare</div>
                    <div style="font-size: 24px; margin-top: 5px;">₹<span id="fareAmount">0</span></div>
                </div>
                
                <button class="btn btn-primary" onclick="bookRide()" id="bookBtn">
                    <i class="fas fa-car"></i> Book Ride
                </button>
                
                <div id="currentRideStatus" style="display: none;">
                    <!-- Current ride status will be shown here -->
                </div>
                
                <div class="auto-refresh">
                    <i class="fas fa-sync-alt"></i> Auto-refreshing every 10 seconds
                </div>
            </div>
            
            <!-- Right Panel - Ride History -->
            <div class="card">
                <h2><i class="fas fa-history"></i> Your Rides</h2>
                <button class="btn btn-warning" onclick="refreshRides()" style="margin-bottom: 15px;">
                    <i class="fas fa-refresh" id="refreshIcon"></i> Refresh
                </button>
                
                <div id="ridesContainer">
                    <div class="no-rides">
                        <i class="fas fa-taxi" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>No rides found</div>
                        <div style="font-size: 14px; margin-top: 10px;">Your ride history will appear here</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentUser = 'user001';
        let currentRideId = null;
        let autoRefreshInterval;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            refreshRides();
            startAutoRefresh();
            
            // Add input event listeners for fare estimation
            document.getElementById('pickup').addEventListener('input', estimateFare);
            document.getElementById('destination').addEventListener('input', estimateFare);
        });
        
        function switchUser() {
            currentUser = document.getElementById('userSelect').value;
            refreshRides();
            
            // Clear current ride status when switching users
            document.getElementById('currentRideStatus').style.display = 'none';
            currentRideId = null;
        }
        
        async function bookRide() {
            const pickup = document.getElementById('pickup').value.trim();
            const destination = document.getElementById('destination').value.trim();
            
            if (!pickup || !destination) {
                alert('Please enter both pickup and destination locations');
                return;
            }
            
            const bookBtn = document.getElementById('bookBtn');
            bookBtn.innerHTML = '<i class="fas fa-spinner loading"></i> Booking...';
            bookBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/ride-request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: currentUser,
                        pickup_location: pickup,
                        destination_location: destination,
                        pickup_lat: 28.6139 + (Math.random() - 0.5) * 0.02, // Random nearby location
                        pickup_lng: 77.2090 + (Math.random() - 0.5) * 0.02,
                        destination_lat: 28.6200 + (Math.random() - 0.5) * 0.02,
                        destination_lng: 77.2200 + (Math.random() - 0.5) * 0.02
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentRideId = data.ride_request.id;
                    alert('Ride booked successfully! Waiting for driver acceptance...');
                    
                    // Clear form
                    document.getElementById('pickup').value = '';
                    document.getElementById('destination').value = '';
                    document.getElementById('priceEstimate').style.display = 'none';
                    
                    // Show ride status
                    showCurrentRideStatus(data.ride_request);
                    
                    // Refresh rides
                    refreshRides();
                } else {
                    alert('Failed to book ride: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error booking ride:', error);
                alert('Failed to book ride. Please try again.');
            } finally {
                bookBtn.innerHTML = '<i class="fas fa-car"></i> Book Ride';
                bookBtn.disabled = false;
            }
        }
        
        async function refreshRides() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('loading');
            
            try {
                const response = await fetch(`${API_BASE}/user/${currentUser}/rides`);
                const data = await response.json();
                
                if (data.success) {
                    displayRides(data.rides);
                    
                    // Check for current active ride
                    const activeRide = data.rides.find(r => 
                        r.status === 'pending' || r.status === 'accepted' || r.status === 'in_progress'
                    );
                    
                    if (activeRide) {
                        currentRideId = activeRide.id;
                        showCurrentRideStatus(activeRide);
                    } else {
                        // No active ride
                        document.getElementById('currentRideStatus').style.display = 'none';
                        currentRideId = null;
                    }
                }
            } catch (error) {
                console.error('Error refreshing rides:', error);
            } finally {
                refreshIcon.classList.remove('loading');
            }
        }
        
        function displayRides(rides) {
            const container = document.getElementById('ridesContainer');
            
            if (rides.length === 0) {
                container.innerHTML = `
                    <div class="no-rides">
                        <i class="fas fa-taxi" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>No rides found</div>
                        <div style="font-size: 14px; margin-top: 10px;">Your ride history will appear here</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <table class="rides-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Status</th>
                            <th>Driver</th>
                            <th>Fare</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rides.map(ride => `
                            <tr>
                                <td>#${ride.id}</td>
                                <td title="${ride.pickup_location}">${truncateText(ride.pickup_location, 20)}</td>
                                <td title="${ride.destination_location}">${truncateText(ride.destination_location, 20)}</td>
                                <td><span class="status-cell status-${ride.status}">${ride.status}</span></td>
                                <td>${ride.driver_name || 'Not assigned'}</td>
                                <td>₹${ride.actual_fare || ride.estimated_fare || 0}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function showCurrentRideStatus(ride) {
            const statusContainer = document.getElementById('currentRideStatus');
            
            let statusClass = 'status-' + ride.status;
            let statusIcon = 'fas fa-clock';
            let statusMessage = 'Waiting for driver...';
            let actionButton = '';
            
            switch(ride.status) {
                case 'pending':
                    statusIcon = 'fas fa-clock';
                    statusMessage = 'Looking for nearby drivers...';
                    actionButton = `<button class="btn btn-danger" onclick="cancelRide(${ride.id})" style="margin-top: 15px;">
                        <i class="fas fa-times"></i> Cancel Ride
                    </button>`;
                    break;
                case 'accepted':
                    statusIcon = 'fas fa-check-circle';
                    statusMessage = `Driver ${ride.driver_name || 'assigned'} is on the way!`;
                    if (ride.driver_phone) {
                        statusMessage += `<br><small>Contact: ${ride.driver_phone}</small>`;
                    }
                    break;
                case 'in_progress':
                    statusIcon = 'fas fa-car';
                    statusMessage = 'Ride in progress. Enjoy your trip!';
                    break;
                case 'completed':
                    statusIcon = 'fas fa-flag-checkered';
                    statusMessage = 'Ride completed. Thank you!';
                    // Hide status after showing completion
                    setTimeout(() => {
                        statusContainer.style.display = 'none';
                        currentRideId = null;
                    }, 5000);
                    break;
                case 'rejected':
                    statusIcon = 'fas fa-exclamation-triangle';
                    statusMessage = 'No drivers available. Please try again.';
                    // Hide status after showing rejection
                    setTimeout(() => {
                        statusContainer.style.display = 'none';
                        currentRideId = null;
                    }, 5000);
                    break;
            }
            
            statusContainer.innerHTML = `
                <div class="ride-status ${statusClass}">
                    <div class="status-icon">
                        <i class="${statusIcon}"></i>
                    </div>
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">
                        Ride #${ride.id}
                    </div>
                    <div style="margin-bottom: 10px;">
                        ${statusMessage}
                    </div>
                    <div style="font-size: 14px; color: #666;">
                        From: ${ride.pickup_location}<br>
                        To: ${ride.destination_location}<br>
                        Fare: ₹${ride.actual_fare || ride.estimated_fare || 0}
                    </div>
                    ${actionButton}
                </div>
            `;
            
            statusContainer.style.display = 'block';
        }
        
        async function cancelRide(rideId) {
            if (!confirm('Are you sure you want to cancel this ride?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/rides/${rideId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        status: 'cancelled'
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('Ride cancelled successfully.');
                    document.getElementById('currentRideStatus').style.display = 'none';
                    currentRideId = null;
                    refreshRides();
                } else {
                    alert('Failed to cancel ride: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error cancelling ride:', error);
                alert('Failed to cancel ride. Please try again.');
            }
        }
        
        function estimateFare() {
            const pickup = document.getElementById('pickup').value.trim();
            const destination = document.getElementById('destination').value.trim();
            
            if (pickup && destination) {
                // Simple fare estimation based on text length (in real app, use distance calculation)
                const estimatedDistance = Math.max(2, (pickup.length + destination.length) / 10);
                const baseFare = 50;
                const farePerKm = 12;
                const estimatedFare = Math.round(baseFare + (estimatedDistance * farePerKm));
                
                document.getElementById('fareAmount').textContent = estimatedFare;
                document.getElementById('priceEstimate').style.display = 'block';
            } else {
                document.getElementById('priceEstimate').style.display = 'none';
            }
        }
        
        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }
        
        function getUserName(userId) {
            const userNames = {
                'user001': 'John Smith',
                'user002': 'Sarah Wilson',
                'user003': 'Mike Johnson'
            };
            return userNames[userId] || 'Unknown User';
        }
        
        function startAutoRefresh() {
            // Auto refresh every 10 seconds if there's an active ride
            autoRefreshInterval = setInterval(() => {
                if (currentRideId) {
                    refreshRides();
                }
            }, 10000);
        }
        
        // Cleanup intervals on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });
    </script>
</body>
</html>
