<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Uber - Driver Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .driver-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        .status-online { background: #27ae60; }
        .status-offline { background: #e74c3c; }
        .status-busy { background: #f39c12; }
        
        .controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .rides-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .rides-table th,
        .rides-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .rides-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .rides-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .status-cell {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            color: white;
        }
        
        .status-pending { background: #f39c12; }
        .status-accepted { background: #27ae60; }
        .status-completed { background: #2980b9; }
        .status-rejected { background: #e74c3c; }
        .status-in_progress { background: #9b59b6; }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .no-rides {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
        
        .refresh-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-car"></i> Driver Dashboard</h1>
            <div class="driver-info">
                <select id="driverSelect" onchange="switchDriver()">
                    <option value="driver001">Rajesh Kumar</option>
                    <option value="driver002">Amit Singh</option>
                    <option value="driver003">Priya Sharma</option>
                </select>
                <span class="status-badge status-offline" id="driverStatus">Offline</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-success" onclick="goOnline()" id="onlineBtn">
                <i class="fas fa-power-off"></i> Go Online
            </button>
            <button class="btn btn-danger" onclick="goOffline()" id="offlineBtn" style="display: none;">
                <i class="fas fa-power-off"></i> Go Offline
            </button>
            <button class="btn btn-primary" onclick="refreshRides()">
                <i class="fas fa-refresh" id="refreshIcon"></i> Refresh Rides
            </button>
            <div class="refresh-info">
                <span>Auto-refresh in <span id="countdown">30</span>s</span>
            </div>
        </div>
        
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="stat-number" id="totalRides">0</div>
                <div class="stat-label">Total Rides Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingRides">0</div>
                <div class="stat-label">Pending Requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedRides">0</div>
                <div class="stat-label">Completed Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">₹<span id="totalEarnings">0</span></div>
                <div class="stat-label">Today's Earnings</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="card">
                <h2><i class="fas fa-list"></i> Available Ride Requests</h2>
                <div id="availableRides">
                    <div class="no-rides">
                        <i class="fas fa-car" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>No ride requests available</div>
                        <div style="font-size: 14px; margin-top: 10px;">Go online to see ride requests</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2><i class="fas fa-history"></i> My Ride History</h2>
                <div id="rideHistory">
                    <div class="no-rides">
                        <i class="fas fa-history" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>No ride history</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        let currentDriver = 'driver001';
        let isOnline = false;
        let autoRefreshInterval;
        let countdownInterval;
        let countdownTime = 30;
        
        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadDriverStatus();
            refreshRides();
            startAutoRefresh();
        });
        
        function switchDriver() {
            currentDriver = document.getElementById('driverSelect').value;
            loadDriverStatus();
            refreshRides();
        }
        
        async function loadDriverStatus() {
            try {
                const response = await fetch(`${API_BASE}/drivers/all`);
                const data = await response.json();
                
                if (data.success) {
                    const driver = data.drivers.find(d => d.driver_id === currentDriver);
                    if (driver) {
                        updateDriverStatus(driver.status);
                    }
                }
            } catch (error) {
                console.error('Error loading driver status:', error);
            }
        }
        
        function updateDriverStatus(status) {
            const statusBadge = document.getElementById('driverStatus');
            const onlineBtn = document.getElementById('onlineBtn');
            const offlineBtn = document.getElementById('offlineBtn');
            
            statusBadge.className = `status-badge status-${status}`;
            statusBadge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            
            isOnline = status === 'online' || status === 'busy';
            
            if (isOnline) {
                onlineBtn.style.display = 'none';
                offlineBtn.style.display = 'flex';
            } else {
                onlineBtn.style.display = 'flex';
                offlineBtn.style.display = 'none';
            }
        }
        
        async function goOnline() {
            try {
                const response = await fetch(`${API_BASE}/drivers/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        driver_id: currentDriver,
                        status: 'online'
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    updateDriverStatus('online');
                    refreshRides();
                }
            } catch (error) {
                console.error('Error going online:', error);
                alert('Failed to go online. Please try again.');
            }
        }
        
        async function goOffline() {
            try {
                const response = await fetch(`${API_BASE}/drivers/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        driver_id: currentDriver,
                        status: 'offline'
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    updateDriverStatus('offline');
                    refreshRides();
                }
            } catch (error) {
                console.error('Error going offline:', error);
                alert('Failed to go offline. Please try again.');
            }
        }
        
        async function refreshRides() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('loading');
            
            try {
                // Load available rides
                const availableResponse = await fetch(`${API_BASE}/drivers/available-rides`);
                const availableData = await availableResponse.json();
                
                if (availableData.success) {
                    displayAvailableRides(availableData.rides);
                }
                
                // Load all rides for statistics
                const allRidesResponse = await fetch(`${API_BASE}/rides/all`);
                const allRidesData = await allRidesResponse.json();
                
                if (allRidesData.success) {
                    updateStatistics(allRidesData.rides);
                    displayRideHistory(allRidesData.rides.filter(r => r.driver_name === getDriverName(currentDriver)));
                }
                
            } catch (error) {
                console.error('Error refreshing rides:', error);
            } finally {
                refreshIcon.classList.remove('loading');
                resetCountdown();
            }
        }
        
        function displayAvailableRides(rides) {
            const container = document.getElementById('availableRides');
            
            if (!isOnline) {
                container.innerHTML = `
                    <div class="no-rides">
                        <i class="fas fa-power-off" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>You are offline</div>
                        <div style="font-size: 14px; margin-top: 10px;">Go online to see ride requests</div>
                    </div>
                `;
                return;
            }
            
            const pendingRides = rides.filter(r => r.status === 'pending');
            
            if (pendingRides.length === 0) {
                container.innerHTML = `
                    <div class="no-rides">
                        <i class="fas fa-check-circle" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>No new ride requests</div>
                        <div style="font-size: 14px; margin-top: 10px;">New requests will appear here</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <table class="rides-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Fare</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${pendingRides.map(ride => `
                            <tr>
                                <td>#${ride.id}</td>
                                <td>${ride.user_name}</td>
                                <td>${ride.pickup_location}</td>
                                <td>${ride.destination_location}</td>
                                <td>₹${ride.estimated_fare || 0}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-small btn-success" onclick="acceptRide(${ride.id})">
                                            <i class="fas fa-check"></i> Accept
                                        </button>
                                        <button class="btn-small btn-danger" onclick="rejectRide(${ride.id})">
                                            <i class="fas fa-times"></i> Reject
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function displayRideHistory(rides) {
            const container = document.getElementById('rideHistory');
            
            if (rides.length === 0) {
                container.innerHTML = `
                    <div class="no-rides">
                        <i class="fas fa-history" style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;"></i>
                        <div>No ride history</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <table class="rides-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Status</th>
                            <th>Fare</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rides.slice(0, 10).map(ride => `
                            <tr>
                                <td>#${ride.id}</td>
                                <td>${ride.user_name}</td>
                                <td>${ride.pickup_location}</td>
                                <td>${ride.destination_location}</td>
                                <td><span class="status-cell status-${ride.status}">${ride.status}</span></td>
                                <td>₹${ride.actual_fare || ride.estimated_fare || 0}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        function updateStatistics(allRides) {
            const today = new Date().toDateString();
            const driverName = getDriverName(currentDriver);
            
            const myRides = allRides.filter(r => r.driver_name === driverName);
            const todayRides = myRides.filter(r => new Date(r.created_at).toDateString() === today);
            const pendingRides = allRides.filter(r => r.status === 'pending');
            const completedToday = todayRides.filter(r => r.status === 'completed');
            
            const totalEarnings = completedToday.reduce((sum, ride) => sum + (ride.actual_fare || ride.estimated_fare || 0), 0);
            
            document.getElementById('totalRides').textContent = todayRides.length;
            document.getElementById('pendingRides').textContent = pendingRides.length;
            document.getElementById('completedRides').textContent = completedToday.length;
            document.getElementById('totalEarnings').textContent = totalEarnings.toFixed(0);
        }
        
        async function acceptRide(rideId) {
            try {
                const response = await fetch(`${API_BASE}/rides/${rideId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        status: 'accepted',
                        driver_id: currentDriver
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    updateDriverStatus('busy');
                    refreshRides();
                    alert('Ride accepted successfully! You are now busy.');
                } else {
                    alert('Failed to accept ride: ' + data.message);
                }
            } catch (error) {
                console.error('Error accepting ride:', error);
                alert('Failed to accept ride. Please try again.');
            }
        }
        
        async function rejectRide(rideId) {
            try {
                const response = await fetch(`${API_BASE}/rides/${rideId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        status: 'rejected'
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    refreshRides();
                    alert('Ride rejected.');
                }
            } catch (error) {
                console.error('Error rejecting ride:', error);
                alert('Failed to reject ride. Please try again.');
            }
        }
        
        function getDriverName(driverId) {
            const driverNames = {
                'driver001': 'Rajesh Kumar',
                'driver002': 'Amit Singh',
                'driver003': 'Priya Sharma'
            };
            return driverNames[driverId] || 'Unknown Driver';
        }
        
        function startAutoRefresh() {
            // Auto refresh every 30 seconds
            autoRefreshInterval = setInterval(refreshRides, 30000);
            
            // Countdown timer
            countdownInterval = setInterval(() => {
                countdownTime--;
                document.getElementById('countdown').textContent = countdownTime;
                
                if (countdownTime <= 0) {
                    resetCountdown();
                }
            }, 1000);
        }
        
        function resetCountdown() {
            countdownTime = 30;
            document.getElementById('countdown').textContent = countdownTime;
        }
        
        // Cleanup intervals on page unload
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            if (countdownInterval) clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
